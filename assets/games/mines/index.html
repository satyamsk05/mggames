<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Mines Pro - BC.Game</title>
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>

<div id="game-container">
  <!-- Hardware Accelerated 60Hz/120Hz Particle Canvas -->
  <canvas id="particlesCanvas"></canvas>

  <!-- HEADER: Clean Style (exact match with home screen balance) -->
  <header class="bcg-header">
    <!-- Left: Back Button -->
    <button class="bcg-back-btn" id="btnBack" title="Exit Game">
      <svg width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
        <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z"/>
      </svg>
    </button>

    <!-- Balance Pill (1-to-1 Match with Home Screen) -->
    <div class="bcg-balance-pill">
      <!-- Rupee Coin Asset -->
      <img src="rupee.png" class="bcg-rupee-img" alt="Rupee">
      <!-- Balance Text -->
      <span class="bcg-balance-val" id="headerBalance">150.57</span>
      <!-- Deposit (+) Button -->
      <button class="bcg-plus-btn" title="Deposit">+</button>
    </div>
  </header>

  <!-- MULTIPLIERS ROAD -->
  <section class="multipliers-container">
    <div class="multipliers-wrapper" id="multipliersWrapper">
      <!-- Generated dynamically -->
    </div>
  </section>

  <!-- BOARD -->
  <section class="boardWrap">
    <img src="top_skull.png" class="board-top-skull" alt="Skull Decor">
    <div class="board" id="board">
      <button class="tile" data-index="0"></button>
      <button class="tile" data-index="1"></button>
      <button class="tile" data-index="2"></button>
      <button class="tile" data-index="3"></button>
      <button class="tile" data-index="4"></button>
      <button class="tile" data-index="5"></button>
      <button class="tile" data-index="6"></button>
      <button class="tile" data-index="7"></button>
      <button class="tile" data-index="8"></button>
      <button class="tile" data-index="9"></button>
      <button class="tile" data-index="10"></button>
      <button class="tile" data-index="11"></button>
      <button class="tile" data-index="12"></button>
      <button class="tile" data-index="13"></button>
      <button class="tile" data-index="14"></button>
      <button class="tile" data-index="15"></button>
      <button class="tile" data-index="16"></button>
      <button class="tile" data-index="17"></button>
      <button class="tile" data-index="18"></button>
      <button class="tile" data-index="19"></button>
      <button class="tile" data-index="20"></button>
      <button class="tile" data-index="21"></button>
      <button class="tile" data-index="22"></button>
      <button class="tile" data-index="23"></button>
      <button class="tile" data-index="24"></button>
    </div>
  </section>

  <!-- CONTROLS PANEL -->
  <section class="controls-panel">
    <!-- Manual / Auto Tabs -->
    <div class="tabs-bar">
      <button class="tab-btn active" id="tabManual">Manual</button>
      <button class="tab-btn" id="tabAuto">Auto</button>
    </div>

    <!-- Bet Amount Section -->
    <div class="field-group">
      <div class="field-header">
        <span class="field-title">Amount <span class="info-icon" title="Minimum bet amount: ₹0.01">ⓘ</span></span>
      </div>
      <div class="field-input-row">
        <div class="amount-input-container">
          <img src="rupee.png" class="input-rupee-img" alt="Rupee">
          <input class="amount-input" type="number" id="betInput" value="10.00" step="1" min="0.01">
        </div>
        <button class="adjust-btn" id="btnHalf">1/2</button>
        <button class="adjust-btn" id="btnDouble">2×</button>
        <button class="adjust-btn icon-swap-btn" id="btnSwap" title="Swap">⇅</button>
      </div>
      <!-- Quick Amount Presets -->
      <div class="presets-row">
        <button class="preset-btn" data-val="10">10</button>
        <button class="preset-btn" data-val="50">50</button>
        <button class="preset-btn" data-val="100">100</button>
        <button class="preset-btn" data-val="500">500</button>
      </div>
    </div>

    <!-- Mines Select Section -->
    <div class="field-group">
      <div class="field-header">
        <span class="field-title">Mines</span>
      </div>
      <div class="slider-container">
        <span id="minesValMin" class="slider-val">3</span>
        <input type="range" id="minesSelect" min="1" max="24" value="3">
        <span class="slider-val">24</span>
      </div>
    </div>

    <!-- Auto Mode: Number of Bets -->
    <div class="field-group auto-only" id="autoBetsGroup" style="display: none;">
      <div class="field-header">
        <span class="field-title">Number of Bets</span>
      </div>
      <div class="field-input-row">
        <div class="amount-input-container">
          <input class="amount-input" type="text" id="autoBetsInput" value="∞" readonly>
        </div>
        <button class="adjust-btn auto-preset" data-bets="inf">∞</button>
        <button class="adjust-btn auto-preset" data-bets="10">10</button>
        <button class="adjust-btn auto-preset" data-bets="100">100</button>
      </div>
    </div>

    <!-- Action Buttons Stack -->
    <div class="action-stack">
      <button class="btn-main btn-bet" id="btnBet">Bet</button>
      <button class="btn-main btn-secondary" id="btnRandom" style="display: none;">Pick a Tile Randomly</button>
    </div>

    <!-- Status Text -->
    <div class="status-text" id="statusText">Set bet amount and click Bet</div>
  </section>
</div>

<script src="script.js"></script>
</body>
</html>
