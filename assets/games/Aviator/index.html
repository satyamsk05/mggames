<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="win-notification" id="winNotification">+₹0.00</div>

    <div class="app">
        <!-- BC.Game Unified Header -->
        <div class="top-nav bcg-header">
            <!-- Back Button -->
            <button class="bcg-back-btn" id="btnBack">
                <svg viewBox="0 0 24 24" width="18" height="18">
                    <path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
                </svg>
            </button>

            <!-- BC.Game Logo -->
            <div class="bcg-logo">
                <svg width="22" height="22" viewBox="0 0 100 100" fill="none">
                    <circle cx="50" cy="50" r="50" fill="#2CD97E"/>
                    <text x="50" y="67" text-anchor="middle" font-family="Inter,sans-serif" font-weight="900" font-size="52" fill="#0d1117">B</text>
                </svg>
                <span class="bcg-logo-text">BC.Game</span>
            </div>

            <!-- Balance Pill -->
            <div class="bcg-balance-pill">
                <div class="bcg-coin">₹</div>
                <span class="bcg-balance-val" id="balanceText">150.57</span>
                <button class="bcg-plus-btn" title="Deposit">+</button>
            </div>

            <!-- Extra actions -->
            <div class="nav-actions">
                <button class="bcg-icon-btn">
                    <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                </button>
                <button class="bcg-icon-btn">
                    <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                </button>
            </div>
        </div>



        <!-- History Bar -->
        <div class="history-bar" id="historyBar">
            <div class="history-pill low">1.06x</div>
            <div class="history-pill low">1.04x</div>
            <div class="history-pill low">1.42x</div>
            <div class="history-pill low">1.46x</div>
            <div class="history-pill medium">12.90x</div>
            <button class="history-clock-btn">
                <svg viewBox="0 0 24 24" width="12" height="12"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 10H8v2h3v3h2v-5z"/></svg>
            </button>
        </div>

        <!-- Game Display (Sky Area) -->
        <div class="game-screen" id="gameScreen">
            <div class="game-multiplier" id="multiplierDisplay">
                <div class="multiplier-crashed" id="crashedLabel" style="display: none;">Flew Away!</div>
                <span class="multiplier-val" id="multiplierValue">1.00</span><span id="multiplierX" style="font-size: 32px; font-weight: 900; color:#fff;">x</span>
            </div>

            <canvas id="flightCanvas"></canvas>

            <!-- Loading overlay -->
            <div class="loading-overlay" id="loadingOverlay">
                <div class="propeller-box" id="propellerBox"></div>
                <div class="loading-title">GETTING THE BETS</div>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="progressBar"></div>
                </div>
                <div class="loading-time" id="loadingTime">5.0s</div>
            </div>
        </div>

        <!-- Betting panels section -->
        <div class="betting-section">
            <!-- Bet Panel 1 -->
            <div class="bet-panel" id="panel1">
                <div class="panel-header">
                    <button class="panel-tab active" onclick="setPanelTab(1, 'bet')">Bet</button>
                    <button class="panel-tab" onclick="setPanelTab(1, 'auto')">Auto</button>
                </div>
                <div class="panel-body">
                    <div class="input-col">
                        <div class="bet-input-box" id="betBox1">
                            <button class="adjust-btn" onclick="adjustBet(1, -10)">-</button>
                            <input type="text" class="bet-val" id="betAmount1" value="10.00" onchange="validateBetInput(1)">
                            <button class="adjust-btn" onclick="adjustBet(1, 10)">+</button>
                        </div>
                        
                        <!-- Auto bet/cashout controls -->
                        <div class="auto-controls" id="autoControls1" style="display: none;">
                            <div class="auto-toggle-row">
                                <label class="toggle-switch">
                                    <input type="checkbox" id="autoBetToggle1">
                                    <span class="toggle-slider"></span>
                                </label>
                                <span class="auto-toggle-label">Auto Bet</span>
                            </div>
                            <div class="auto-toggle-row">
                                <label class="toggle-switch">
                                    <input type="checkbox" id="autoCashoutToggle1">
                                    <span class="toggle-slider"></span>
                                </label>
                                <span class="auto-toggle-label">Auto Cash Out</span>
                            </div>
                            <div class="auto-cashout-box">
                                <input type="text" class="auto-input" id="autoCashoutAt1" value="1.25">
                                <span>x</span>
                            </div>
                        </div>

                        <div class="quick-grid">
                            <button class="quick-val-btn" onclick="setQuickBet(1, 100)">100</button>
                            <button class="quick-val-btn" onclick="setQuickBet(1, 200)">200</button>
                            <button class="quick-val-btn" onclick="setQuickBet(1, 500)">500</button>
                            <button class="quick-val-btn" onclick="setQuickBet(1, 1000)">1000</button>
                        </div>
                    </div>
                    <div class="button-col">
                        <button class="place-bet-btn" id="betBtn1" onclick="handleBetClick(1)">
                            <span class="btn-title-text" id="betBtnTitle1">Bet</span>
                            <span class="btn-sub-text" id="betBtnSub1">10.00 INR</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Bet Panel 2 -->
            <div class="bet-panel" id="panel2">
                <div class="panel-header">
                    <button class="panel-tab active" onclick="setPanelTab(2, 'bet')">Bet</button>
                    <button class="panel-tab" onclick="setPanelTab(2, 'auto')">Auto</button>
                </div>
                <div class="panel-body">
                    <div class="input-col">
                        <div class="bet-input-box" id="betBox2">
                            <button class="adjust-btn" onclick="adjustBet(2, -10)">-</button>
                            <input type="text" class="bet-val" id="betAmount2" value="10.00" onchange="validateBetInput(2)">
                            <button class="adjust-btn" onclick="adjustBet(2, 10)">+</button>
                        </div>
                        
                        <!-- Auto bet/cashout controls -->
                        <div class="auto-controls" id="autoControls2" style="display: none;">
                            <div class="auto-toggle-row">
                                <label class="toggle-switch">
                                    <input type="checkbox" id="autoBetToggle2">
                                    <span class="toggle-slider"></span>
                                </label>
                                <span class="auto-toggle-label">Auto Bet</span>
                            </div>
                            <div class="auto-toggle-row">
                                <label class="toggle-switch">
                                    <input type="checkbox" id="autoCashoutToggle2">
                                    <span class="toggle-slider"></span>
                                </label>
                                <span class="auto-toggle-label">Auto Cash Out</span>
                            </div>
                            <div class="auto-cashout-box">
                                <input type="text" class="auto-input" id="autoCashoutAt2" value="1.25">
                                <span>x</span>
                            </div>
                        </div>

                        <div class="quick-grid">
                            <button class="quick-val-btn" onclick="setQuickBet(2, 100)">100</button>
                            <button class="quick-val-btn" onclick="setQuickBet(2, 200)">200</button>
                            <button class="quick-val-btn" onclick="setQuickBet(2, 500)">500</button>
                            <button class="quick-val-btn" onclick="setQuickBet(2, 1000)">1000</button>
                        </div>
                    </div>
                    <div class="button-col">
                        <button class="place-bet-btn" id="betBtn2" onclick="handleBetClick(2)">
                            <span class="btn-title-text" id="betBtnTitle2">Bet</span>
                            <span class="btn-sub-text" id="betBtnSub2">10.00 INR</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Live Bets Log Panel -->
        <div class="live-bets-panel">
            <div class="live-tabs">
                <button class="live-tab active">All bets</button>
                <button class="live-tab">My bets</button>
                <button class="live-tab">Ranks</button>
            </div>
            <div class="bets-header">
                <span class="user-col">User</span>
                <span class="amt-col">Bet INR</span>
                <span class="mult-col">X</span>
                <span class="payout-col">Cash out</span>
            </div>
            <div class="bets-list" id="betsList">
                <!-- Live bets appended dynamically -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
